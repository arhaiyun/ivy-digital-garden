name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# peaceiris/actions-gh-pages 需要写入 gh-pages 分支
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS media
        run: git lfs pull

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build:all
        env:
          VITEPRESS_BASE: /ivy-digital-garden/

      - name: Add .nojekyll
        run: touch .vitepress/dist/.nojekyll

      - name: Verify build output
        run: |
          test -f .vitepress/dist/index.html
          test -f .vitepress/dist/404.html
          ls -la .vitepress/dist | head -20

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .vitepress/dist
          publish_branch: gh-pages
          force_orphan: true
