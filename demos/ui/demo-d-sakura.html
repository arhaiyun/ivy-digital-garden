<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo D · 樱花绘本 · Ivy</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Shippori+Mincho:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff5f8;
      --bg2: #ffe8f0;
      --ink: #5c3d4a;
      --muted: #9a7a86;
      --pink: #f2a7b8;
      --rose: #e8879a;
      --cream: #fff9fb;
      --round: "M PLUS Rounded 1c", sans-serif;
      --serif: "Shippori Mincho", serif;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: var(--round); background: var(--bg); color: var(--ink);
      min-height: 100vh; overflow-x: hidden;
    }
    .petal {
      position: fixed; width: 12px; height: 12px; background: var(--pink);
      border-radius: 0 50% 50% 50%; opacity: .35; pointer-events: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
      10% { opacity: .4; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
    .shell { max-width: 960px; margin: 0 auto; padding: 20px 18px 90px; position: relative; z-index: 1; }
    .top {
      text-align: center; padding: 28px 0 20px;
    }
    .top h1 {
      font-family: var(--serif); font-size: clamp(1.8rem, 5vw, 2.6rem);
      color: var(--rose); letter-spacing: .08em;
    }
    .top p { color: var(--muted); font-size: 14px; margin-top: 8px; }
    .ribbon {
      display: inline-flex; gap: 6px; background: #fff; padding: 8px;
      border-radius: 999px; box-shadow: 0 8px 24px rgba(232,135,154,.15); margin-top: 20px;
    }
    .ribbon button {
      border: none; background: transparent; font: inherit; cursor: pointer;
      padding: 10px 18px; border-radius: 999px; color: var(--muted); transition: .25s;
    }
    .ribbon button.active { background: var(--bg2); color: var(--rose); font-weight: 700; }
    .page { display: none; animation: pop .4s cubic-bezier(.34,1.56,.64,1); }
    .page.active { display: block; }
    @keyframes pop { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:none; } }
    .book-cover {
      background: linear-gradient(160deg, #fff, var(--bg2));
      border: 3px solid #fff; border-radius: 28px;
      box-shadow: 0 20px 50px rgba(232,135,154,.2), inset 0 0 0 1px rgba(242,167,184,.3);
      padding: 36px 28px; text-align: center; margin-bottom: 20px; position: relative;
    }
    .book-cover::before, .book-cover::after {
      content: "✿"; position: absolute; color: var(--pink); font-size: 1.2rem; opacity: .6;
    }
    .book-cover::before { top: 16px; left: 20px; }
    .book-cover::after { bottom: 16px; right: 20px; }
    .avatar {
      width: 88px; height: 88px; margin: 0 auto 16px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, var(--pink));
      border: 4px solid #fff; box-shadow: 0 8px 20px rgba(232,135,154,.25);
      display: grid; place-items: center; font-family: var(--serif); font-size: 2rem; color: #fff;
    }
    .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
    .stat-box {
      background: #fff; border-radius: 20px; padding: 16px 10px; text-align: center;
      border: 2px dashed rgba(242,167,184,.4);
    }
    .stat-box b { display: block; font-size: 1.5rem; color: var(--rose); margin-top: 4px; }
    .stat-box span { font-size: 11px; color: var(--muted); }
    .story-card {
      background: #fff; border-radius: 22px; padding: 20px; margin-bottom: 12px;
      border-left: 5px solid var(--pink); box-shadow: 0 6px 20px rgba(232,135,154,.1);
    }
    .story-card time { font-size: 12px; color: var(--rose); font-weight: 700; }
    .story-card h3 { font-family: var(--serif); margin: 6px 0; font-size: 1.15rem; }
    .story-card p { font-size: 14px; color: var(--muted); line-height: 1.7; }
    .song-bubble {
      display: flex; align-items: center; gap: 14px;
      background: linear-gradient(90deg, #fff, var(--bg2));
      border-radius: 24px; padding: 14px 18px; margin-bottom: 10px;
      border: 2px solid #fff; box-shadow: 0 8px 24px rgba(232,135,154,.12);
      cursor: pointer; transition: transform .2s;
    }
    .song-bubble:hover { transform: scale(1.02); }
    .note {
      width: 48px; height: 48px; border-radius: 14px; background: var(--rose); color: #fff;
      display: grid; place-items: center; font-size: 20px; flex-shrink: 0;
    }
    .gallery { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .pic {
      border-radius: 18px; aspect-ratio: 1; background: linear-gradient(135deg,#ffd6e0,#ffc4d4);
      border: 3px solid #fff; position: relative; overflow: hidden;
      box-shadow: 0 8px 20px rgba(232,135,154,.15);
    }
    .pic span {
      position: absolute; bottom: 8px; left: 8px; right: 8px;
      background: rgba(255,255,255,.9); font-size: 11px; padding: 6px 8px;
      border-radius: 10px; text-align: center;
    }
    .back {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: var(--rose); color: #fff; padding: 12px 24px; border-radius: 999px;
      text-decoration: none; font-size: 13px; box-shadow: 0 8px 24px rgba(232,135,154,.35);
    }
    @media (max-width: 600px) { .stats-row { grid-template-columns: repeat(2,1fr); } .gallery { grid-template-columns: repeat(2,1fr); } }
  </style>
</head>
<body>
  <div class="petal" style="left:10%;animation-duration:14s;animation-delay:0s"></div>
  <div class="petal" style="left:30%;animation-duration:18s;animation-delay:2s"></div>
  <div class="petal" style="left:70%;animation-duration:16s;animation-delay:4s"></div>
  <div class="petal" style="left:85%;animation-duration:20s;animation-delay:1s"></div>

  <div class="shell">
    <div class="top">
      <h1>Ivy 的樱花绘本</h1>
      <p>像翻一本粉色童话书，记录小公主的每一天</p>
      <div class="ribbon">
        <button class="active" data-p="home">封面</button>
        <button data-p="timeline">故事</button>
        <button data-p="playlist">儿歌</button>
        <button data-p="gallery">相册</button>
      </div>
    </div>

    <section class="page active" id="home">
      <div class="book-cover">
        <div class="avatar">I</div>
        <h2 style="font-family:var(--serif);font-size:1.5rem;color:var(--rose)">亲爱的 Ivy</h2>
        <p style="margin-top:10px;color:var(--muted);font-size:14px;line-height:1.8">2026.03.05 生于上海 · 今天第 91 天</p>
      </div>
      <div class="stats-row">
        <div class="stat-box"><span>记忆</span><b>12</b></div>
        <div class="stat-box"><span>照片</span><b>48</b></div>
        <div class="stat-box"><span>歌曲</span><b>6</b></div>
        <div class="stat-box"><span>第一次</span><b>9</b></div>
      </div>
    </section>

    <section class="page" id="timeline">
      <div class="story-card"><time>06.04</time><h3>花园启程</h3><p>爸爸妈妈为你种下第一棵数字小树。</p></div>
      <div class="story-card"><time>03.15</time><h3>第一次听小星星</h3><p>睡前轻轻哼唱，你安静地眯着眼。</p></div>
      <div class="story-card"><time>03.05</time><h3>小公主来到世界</h3><p>欢迎来到这个世界，我们的宝贝。</p></div>
    </section>

    <section class="page" id="playlist">
      <div class="song-bubble"><div class="note">♪</div><div><strong>小星星</strong><div style="font-size:12px;color:var(--muted);margin-top:2px">睡前 · 0月龄</div></div></div>
      <div class="song-bubble"><div class="note">♪</div><div><strong>世上只有妈妈好</strong><div style="font-size:12px;color:var(--muted);margin-top:2px">外婆唱给你听 · 2月龄</div></div></div>
    </section>

    <section class="page" id="gallery">
      <div class="gallery">
        <div class="pic"><span>第一次笑</span></div>
        <div class="pic"><span>洗澡时光</span></div>
        <div class="pic"><span>小星星</span></div>
        <div class="pic"><span>花园启程</span></div>
        <div class="pic"><span>出生那天</span></div>
        <div class="pic"><span>爸爸哼唱</span></div>
      </div>
    </section>
  </div>
  <a class="back" href="index.html">← 返回选择</a>
  <script>
    document.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('[data-p]').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById(b.dataset.p).classList.add('active');
    }));
  </script>
</body>
</html>
