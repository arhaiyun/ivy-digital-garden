<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo F · 蕾丝梦境 · Ivy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #faf7fc;
      --panel: #ffffff;
      --ink: #4a3d5c;
      --muted: #9b8fad;
      --lilac: #c4b5e0;
      --blush: #f5d5e0;
      --pearl: #fff5f9;
      --serif: "Cormorant Infant", Georgia, serif;
      --sans: "Karla", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: var(--sans); background: var(--bg); color: var(--ink);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse at 0% 0%, rgba(245,213,224,.5), transparent 50%),
        radial-gradient(ellipse at 100% 100%, rgba(196,181,224,.35), transparent 50%);
    }
    .frame-outer {
      max-width: 880px; margin: 24px auto; padding: 12px;
      background: var(--panel);
      border: 1px solid rgba(196,181,224,.4);
      box-shadow: 0 0 0 8px var(--pearl), 0 24px 60px rgba(74,61,92,.08);
      position: relative;
    }
    .frame-outer::before {
      content: ""; position: absolute; inset: 6px; pointer-events: none;
      border: 1px dashed rgba(196,181,224,.5);
    }
    .inner { padding: 28px 24px 60px; position: relative; }
    .crown { text-align: center; margin-bottom: 28px; }
    .crown svg { width: 48px; opacity: .7; }
    .crown h1 {
      font-family: var(--serif); font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 600; color: var(--ink); margin-top: 12px; letter-spacing: .04em;
    }
    .crown p { color: var(--muted); font-size: 14px; margin-top: 8px; font-style: italic; font-family: var(--serif); }
    .menu {
      display: flex; justify-content: center; gap: 4px; flex-wrap: wrap;
      border-top: 1px solid rgba(196,181,224,.3); border-bottom: 1px solid rgba(196,181,224,.3);
      padding: 12px 0; margin-bottom: 28px;
    }
    .menu button {
      border: none; background: transparent; font-family: var(--serif);
      font-size: 1.05rem; color: var(--muted); cursor: pointer; padding: 8px 16px;
      transition: color .2s; position: relative;
    }
    .menu button.active { color: var(--ink); }
    .menu button.active::after {
      content: "♡"; position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
      font-size: 10px; color: var(--lilac);
    }
    .view { display: none; animation: fadeUp .5s ease; }
    .view.active { display: block; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .portrait {
      display: grid; grid-template-columns: 1fr 1.2fr; gap: 24px; align-items: center;
      background: linear-gradient(135deg, var(--pearl), #fff);
      padding: 28px; margin-bottom: 20px;
      border: 1px solid rgba(245,213,224,.6);
    }
    .oval {
      width: 100%; aspect-ratio: 3/4; max-width: 200px; margin: 0 auto;
      border-radius: 50% 50% 45% 45%; background: linear-gradient(180deg, var(--blush), var(--lilac));
      border: 3px solid #fff; box-shadow: 0 12px 32px rgba(196,181,224,.25);
      display: grid; place-items: center; font-family: var(--serif); font-size: 3rem; color: #fff;
    }
    .portrait h2 { font-family: var(--serif); font-size: 1.8rem; }
    .portrait p { color: var(--muted); line-height: 1.8; margin-top: 10px; font-size: 14px; }
    .lace-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
    .lace-stat {
      text-align: center; padding: 16px 8px;
      background: #fff; border: 1px solid rgba(196,181,224,.35);
    }
    .lace-stat b { font-family: var(--serif); font-size: 1.6rem; color: var(--lilac); display: block; }
    .lace-stat span { font-size: 11px; color: var(--muted); letter-spacing: .05em; }
    .diary-entry {
      padding: 20px 0; border-bottom: 1px solid rgba(196,181,224,.25);
      display: grid; grid-template-columns: 80px 1fr; gap: 16px;
    }
    .diary-entry date { font-family: var(--serif); color: var(--lilac); font-size: 1.1rem; }
    .diary-entry h3 { font-family: var(--serif); font-size: 1.25rem; margin-bottom: 4px; }
    .diary-entry p { font-size: 14px; color: var(--muted); line-height: 1.7; }
    .music-row {
      display: flex; align-items: center; gap: 16px; padding: 16px;
      background: #fff; border: 1px solid rgba(245,213,224,.8); margin-bottom: 10px;
      transition: box-shadow .25s; cursor: pointer;
    }
    .music-row:hover { box-shadow: 0 8px 24px rgba(196,181,224,.2); }
    .disc {
      width: 56px; height: 56px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--blush), var(--lilac));
      border: 2px solid #fff; display: grid; place-items: center; color: #fff;
    }
    .treasure { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    .treasure-item {
      aspect-ratio: .9; background: #fff; border: 1px solid rgba(196,181,224,.4);
      display: flex; flex-direction: column; justify-content: end; padding: 14px;
      position: relative; overflow: hidden;
    }
    .treasure-item::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(245,213,224,.4));
    }
    .treasure-item strong { font-family: var(--serif); font-size: 1rem; position: relative; }
    .treasure-item small { font-size: 11px; color: var(--muted); position: relative; }
    .back {
      display: block; text-align: center; margin-top: 32px;
      color: var(--lilac); text-decoration: none; font-family: var(--serif); font-size: 1rem;
    }
    @media (max-width: 640px) {
      .portrait { grid-template-columns: 1fr; text-align: center; }
      .lace-stats { grid-template-columns: repeat(2,1fr); }
      .diary-entry { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="frame-outer">
    <div class="inner">
      <div class="crown">
        <svg viewBox="0 0 48 24" fill="none"><path d="M4 18 L8 8 L16 14 L24 4 L32 14 L40 8 L44 18 Z" stroke="#c4b5e0" stroke-width="1.5" fill="rgba(245,213,224,.3)"/></svg>
        <h1>Ivy 蕾丝梦境</h1>
        <p>精致 · 柔软 · 像小公主的私人日记本</p>
      </div>
      <nav class="menu">
        <button class="active" data-v="home">扉页</button>
        <button data-v="timeline">日记</button>
        <button data-v="playlist">歌谣</button>
        <button data-v="treasure">珍宝</button>
      </nav>

      <section class="view active" id="home">
        <div class="portrait">
          <div class="oval">I</div>
          <div>
            <h2>我们的小公主</h2>
            <p>2026年3月5日，你来到上海。从那一天起，爸爸妈妈想为你珍藏每一个温柔瞬间。</p>
          </div>
        </div>
        <div class="lace-stats">
          <div class="lace-stat"><b>91</b><span>天</span></div>
          <div class="lace-stat"><b>48</b><span>影像</span></div>
          <div class="lace-stat"><b>6</b><span>歌谣</span></div>
          <div class="lace-stat"><b>12</b><span>故事</span></div>
        </div>
      </section>

      <section class="view" id="timeline">
        <div class="diary-entry"><date>06.04</date><div><h3>花园启程</h3><p>为你种下第一棵数字树。</p></div></div>
        <div class="diary-entry"><date>03.15</date><div><h3>小星星</h3><p>第一次睡前哼唱，你安静地听着。</p></div></div>
        <div class="diary-entry"><date>03.05</date><div><h3>出生</h3><p>欢迎来到世界，Ivy。</p></div></div>
      </section>

      <section class="view" id="playlist">
        <div class="music-row"><div class="disc">♪</div><div><strong style="font-family:var(--serif);font-size:1.15rem">小星星</strong><div style="font-size:13px;color:var(--muted);margin-top:4px">传统儿歌 · 睡前 · 0月龄</div></div></div>
        <div class="music-row"><div class="disc">♪</div><div><strong style="font-family:var(--serif);font-size:1.15rem">世上只有妈妈好</strong><div style="font-size:13px;color:var(--muted);margin-top:4px">外婆唱 · 2月龄</div></div></div>
      </section>

      <section class="view" id="treasure">
        <div class="treasure">
          <div class="treasure-item"><strong>第一次笑</strong><small>照片</small></div>
          <div class="treasure-item"><strong>洗澡</strong><small>视频</small></div>
          <div class="treasure-item"><strong>哼唱</strong><small>音频</small></div>
        </div>
      </section>

      <a class="back" href="index.html">← 返回选择其他风格</a>
    </div>
  </div>
  <script>
    document.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('[data-v]').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById(b.dataset.v).classList.add('active');
    }));
  </script>
</body>
</html>
