<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E2 · 糖果云朵·绢纱 · Ivy</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fffcfa;
      --surface: #ffffff;
      --ink: #3d3548;
      --muted: #8e8498;
      --rose: #e8a4b4;
      --rose-soft: #fceef2;
      --mint: #9fd4c4;
      --mint-soft: #edf8f4;
      --lav: #b8a8d9;
      --lav-soft: #f3effa;
      --gold: #d4b896;
      --serif: "Fraunces", serif;
      --sans: "Plus Jakarta Sans", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: var(--sans); background: var(--bg); color: var(--ink);
      min-height: 100vh; font-size: 15px; line-height: 1.6;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .4;
      background: radial-gradient(ellipse 70% 50% at 0% 0%, var(--rose-soft), transparent 55%),
                  radial-gradient(ellipse 50% 40% at 100% 20%, var(--lav-soft), transparent 50%),
                  radial-gradient(ellipse 60% 40% at 50% 100%, var(--mint-soft), transparent 55%);
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 40px 24px 100px; position: relative; z-index: 1; }
    .mast {
      display: flex; justify-content: space-between; align-items: flex-end;
      flex-wrap: wrap; gap: 20px; margin-bottom: 36px; padding-bottom: 28px;
      border-bottom: 1px solid rgba(232,164,180,.2);
    }
    .mast h1 {
      font-family: var(--serif); font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 500; letter-spacing: -.02em;
    }
    .mast h1 em { font-style: italic; color: var(--rose); font-weight: 500; }
    .mast p { color: var(--muted); font-size: 13px; margin-top: 6px; letter-spacing: .04em; }
    .tabs { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 14px; border: 1px solid rgba(0,0,0,.04); }
    .tabs button {
      border: none; background: transparent; font: 500 13px var(--sans);
      color: var(--muted); padding: 10px 16px; border-radius: 10px; cursor: pointer; transition: .2s;
    }
    .tabs button.active { background: var(--rose-soft); color: var(--ink); }
    .view { display: none; animation: fade .35s ease; }
    .view.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .hero {
      display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-bottom: 20px;
    }
    .hero-main {
      background: var(--surface); border-radius: 20px; padding: 36px 32px;
      border: 1px solid rgba(232,164,180,.15);
      box-shadow: 0 20px 50px rgba(61,53,72,.04);
    }
    .hero-main .label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--rose); }
    .hero-main h2 { font-family: var(--serif); font-size: 2rem; margin: 12px 0 16px; font-weight: 500; }
    .hero-main p { color: var(--muted); font-size: 14px; max-width: 36ch; }
    .hero-side {
      display: flex; flex-direction: column; gap: 12px;
    }
    .mini-card {
      flex: 1; background: var(--surface); border-radius: 16px; padding: 20px 22px;
      border: 1px solid rgba(0,0,0,.04); display: flex; justify-content: space-between; align-items: center;
    }
    .mini-card b { font-family: var(--serif); font-size: 1.75rem; color: var(--rose); }
    .mini-card span { font-size: 12px; color: var(--muted); }
    .mini-card.accent-mint b { color: var(--mint); }
    .mini-card.accent-lav b { color: var(--lav); }
    .metrics { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
    .metric {
      text-align: center; padding: 22px 12px; background: var(--surface);
      border-radius: 14px; border: 1px solid rgba(0,0,0,.04);
    }
    .metric b { display: block; font-family: var(--serif); font-size: 1.5rem; margin-bottom: 4px; }
    .metric span { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
    .timeline { display: grid; gap: 0; }
    .tl-item {
      display: grid; grid-template-columns: 88px 1fr; gap: 20px; padding: 22px 0;
      border-bottom: 1px solid rgba(232,164,180,.12);
    }
    .tl-item time { font-size: 13px; color: var(--gold); font-weight: 600; padding-top: 2px; }
    .tl-item h3 { font-family: var(--serif); font-size: 1.15rem; font-weight: 500; margin-bottom: 4px; }
    .tl-item p { font-size: 13px; color: var(--muted); }
    .tag { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 6px; margin-top: 8px; margin-right: 4px; background: var(--rose-soft); color: var(--rose); }
    .songs { display: grid; gap: 10px; }
    .song {
      display: flex; align-items: center; gap: 18px; padding: 18px 20px;
      background: var(--surface); border-radius: 16px;
      border: 1px solid rgba(232,164,180,.12); transition: border-color .2s, box-shadow .2s; cursor: pointer;
    }
    .song:hover { border-color: rgba(232,164,180,.35); box-shadow: 0 8px 28px rgba(61,53,72,.05); }
    .song-icon {
      width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--rose-soft), var(--lav-soft));
      display: grid; place-items: center; font-size: 14px; color: var(--rose);
    }
    .song strong { font-weight: 600; font-size: 15px; }
    .song small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .grid-media { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    .tile {
      aspect-ratio: 1; border-radius: 14px; overflow: hidden; position: relative;
      background: linear-gradient(145deg, var(--rose-soft), var(--mint-soft));
      border: 1px solid rgba(255,255,255,.8);
    }
    .tile figcaption {
      position: absolute; inset: auto 0 0 0; padding: 12px 14px;
      background: rgba(255,255,255,.92); font-size: 12px; font-weight: 500;
      backdrop-filter: blur(8px);
    }
    .back { display: inline-block; margin-top: 40px; color: var(--muted); font-size: 13px; text-decoration: none; }
    .back:hover { color: var(--rose); }
    @media (max-width: 700px) {
      .hero { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2,1fr); }
      .tl-item { grid-template-columns: 1fr; }
      .grid-media { grid-template-columns: repeat(2,1fr); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <div>
        <h1>Ivy <em>绢纱云朵</em></h1>
        <p>E2 · 低饱和 · 大留白 · 绢纱质感</p>
      </div>
      <nav class="tabs">
        <button class="active" data-t="home">概览</button>
        <button data-t="timeline">时间轴</button>
        <button data-t="playlist">歌单</button>
        <button data-t="media">相册</button>
      </nav>
    </header>

    <section class="view active" id="home">
      <div class="hero">
        <div class="hero-main">
          <div class="label">Little Princess</div>
          <h2>第 91 天</h2>
          <p>2026.03.05 生于上海。在这里，每一首歌、每一张照片，都为 Ivy 轻轻收好。</p>
        </div>
        <div class="hero-side">
          <div class="mini-card"><div><span>照片</span><b>48</b></div></div>
          <div class="mini-card accent-mint"><div><span>歌谣</span><b>6</b></div></div>
          <div class="mini-card accent-lav"><div><span>记忆</span><b>12</b></div></div>
        </div>
      </div>
      <div class="metrics">
        <div class="metric"><b>3</b><span>月龄</span></div>
        <div class="metric"><b>9</b><span>里程碑</span></div>
        <div class="metric"><b>48</b><span>影像</span></div>
        <div class="metric"><b>6</b><span>歌曲</span></div>
      </div>
    </section>

    <section class="view" id="timeline">
      <div class="timeline">
        <article class="tl-item"><time>06.04</time><div><h3>花园启程</h3><p>种下第一棵数字树。</p><span class="tag">日记</span></div></article>
        <article class="tl-item"><time>03.15</time><div><h3>小星星</h3><p>睡前哼唱，安静入睡。</p><span class="tag">歌单</span><span class="tag" style="background:var(--lav-soft);color:var(--lav)">睡前</span></div></article>
        <article class="tl-item"><time>03.05</time><div><h3>出生</h3><p>欢迎来到世界。</p><span class="tag">里程碑</span></div></article>
      </div>
    </section>

    <section class="view" id="playlist">
      <div class="songs">
        <div class="song"><div class="song-icon">♪</div><div><strong>小星星</strong><small>传统儿歌 · 0月龄 · 网易云</small></div></div>
        <div class="song"><div class="song-icon">♪</div><div><strong>世上只有妈妈好</strong><small>外婆哼唱 · 本地录音</small></div></div>
      </div>
    </section>

    <section class="view" id="media">
      <div class="grid-media">
        <figure class="tile"><figcaption>第一次笑</figcaption></figure>
        <figure class="tile"><figcaption>洗澡时光</figcaption></figure>
        <figure class="tile"><figcaption>小星星</figcaption></figure>
        <figure class="tile"><figcaption>花园启程</figcaption></figure>
        <figure class="tile"><figcaption>出生那天</figcaption></figure>
        <figure class="tile"><figcaption>爸爸哼唱</figcaption></figure>
      </div>
    </section>

    <a class="back" href="index.html">← 返回选择</a>
  </div>
  <script>
    document.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('[data-t]').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById(b.dataset.t).classList.add('active');
    }));
  </script>
</body>
</html>
