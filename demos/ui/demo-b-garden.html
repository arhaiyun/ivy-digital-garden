<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo B · 苔藓花园 · Ivy</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e8f2ec;
      --bg2: #d4e8dc;
      --ink: #1a3329;
      --muted: #5a7a6a;
      --moss: #3d6b5a;
      --bloom: #f0d9b5;
      --glass: rgba(255,255,255,.55);
      --serif: "Fraunces", serif;
      --sans: "Outfit", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: var(--sans); color: var(--ink); min-height: 100vh;
      background: radial-gradient(ellipse 80% 60% at 10% 0%, #f5faf7, var(--bg)),
                  radial-gradient(ellipse 60% 50% at 90% 100%, var(--bg2), var(--bg));
    }
    .blob {
      position: fixed; border-radius: 50%; filter: blur(60px); opacity: .5; pointer-events: none; z-index: 0;
    }
    .blob.a { width: 320px; height: 320px; background: #a8d5ba; top: -80px; right: 10%; }
    .blob.b { width: 260px; height: 260px; background: var(--bloom); bottom: 10%; left: -60px; }
    .app { max-width: 1100px; margin: 0 auto; padding: 24px 20px 100px; position: relative; z-index: 1; }
    header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;
      background: var(--glass); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.7);
      border-radius: 24px; padding: 16px 22px; margin-bottom: 28px;
    }
    .brand { font-family: var(--serif); font-size: 1.5rem; }
    .tabs { display: flex; gap: 6px; background: rgba(61,107,90,.08); padding: 6px; border-radius: 16px; }
    .tabs button {
      border: none; background: transparent; font: inherit; cursor: pointer;
      padding: 10px 16px; border-radius: 12px; color: var(--muted); transition: .25s;
    }
    .tabs button.active { background: #fff; color: var(--moss); box-shadow: 0 4px 16px rgba(61,107,90,.12); }
    .view { display: none; animation: bloom .45s ease; }
    .view.active { display: block; }
    @keyframes bloom { from { opacity:0; transform:scale(.98); } to { opacity:1; transform:none; } }
    .hero {
      border-radius: 32px; padding: 48px 36px; position: relative; overflow: hidden;
      background: linear-gradient(135deg, rgba(61,107,90,.9), rgba(90,122,106,.75));
      color: #fff; margin-bottom: 24px;
    }
    .hero::before {
      content: ""; position: absolute; width: 200px; height: 200px; border-radius: 50%;
      background: rgba(255,255,255,.08); top: -60px; right: -40px;
    }
    .hero h1 { font-family: var(--serif); font-size: clamp(2.2rem,6vw,3.6rem); line-height: 1.1; }
    .hero p { margin-top: 14px; opacity: .88; max-width: 40ch; line-height: 1.7; font-weight: 300; }
    .bento { display: grid; grid-template-columns: repeat(12,1fr); gap: 14px; }
    .card {
      background: var(--glass); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.75); border-radius: 22px; padding: 22px;
      transition: transform .3s ease;
    }
    .card:hover { transform: translateY(-2px); }
    .card b { font-family: var(--serif); font-size: 2rem; color: var(--moss); display: block; margin-top: 6px; }
    .span4 { grid-column: span 4; }
    .span8 { grid-column: span 8; }
    .span6 { grid-column: span 6; }
    .span12 { grid-column: span 12; }
    .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
    .vine {
      position: relative; padding-left: 28px;
    }
    .vine::before {
      content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(180deg, var(--moss), var(--bloom)); border-radius: 99px;
    }
    .vine-item {
      background: var(--glass); border: 1px solid rgba(255,255,255,.8);
      border-radius: 18px; padding: 18px 20px; margin-bottom: 14px;
      position: relative;
    }
    .vine-item::before {
      content: ""; position: absolute; left: -24px; top: 22px; width: 12px; height: 12px;
      background: var(--moss); border-radius: 50%; border: 3px solid var(--bg);
    }
    .song-card {
      display: flex; gap: 16px; align-items: center;
      background: #fff; border-radius: 20px; padding: 16px; margin-bottom: 12px;
      border: 1px solid rgba(61,107,90,.1); cursor: pointer; transition: .2s;
    }
    .song-card:hover { box-shadow: 0 8px 28px rgba(61,107,90,.12); }
    .disc {
      width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
      background: conic-gradient(from 0deg, var(--moss), var(--bloom), var(--moss));
      display: grid; place-items: center; color: #fff; font-size: 18px;
      animation: spin 8s linear infinite paused;
    }
    .song-card:hover .disc { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .media-masonry { columns: 3; column-gap: 14px; }
    .media-masonry .tile {
      break-inside: avoid; margin-bottom: 14px; border-radius: 18px; overflow: hidden;
      background: #fff; border: 1px solid rgba(61,107,90,.12);
    }
    .tile-cover { height: 140px; background: linear-gradient(160deg,#c5e4d0,#9fcdb0); }
    .tile-body { padding: 14px; font-size: 14px; }
    .back { position: fixed; bottom: 20px; right: 20px; background: var(--moss); color: #fff; padding: 12px 18px; border-radius: 14px; text-decoration: none; font-size: 13px; }
    @media (max-width: 768px) {
      .span4,.span6,.span8 { grid-column: span 12; }
      .media-masonry { columns: 2; }
    }
  </style>
</head>
<body>
  <div class="blob a"></div>
  <div class="blob b"></div>
  <div class="app">
    <header>
      <div class="brand">Ivy 苔藓花园</div>
      <div class="tabs">
        <button class="active" data-view="home">概览</button>
        <button data-view="timeline">藤蔓轴</button>
        <button data-view="playlist">歌单</button>
        <button data-view="media">媒体</button>
      </div>
    </header>

    <section class="view active" id="home">
      <div class="hero">
        <h1>陪她一起<br>慢慢长大</h1>
        <p>每一张照片、每一段哼唱，都像花园里新长出的一片叶子。</p>
      </div>
      <div class="bento">
        <div class="card span4"><span class="label">天数</span><b>91</b></div>
        <div class="card span4"><span class="label">歌曲</span><b>6</b></div>
        <div class="card span4"><span class="label">照片</span><b>48</b></div>
        <div class="card span8"><span class="label">最近更新</span><p style="margin-top:10px;line-height:1.7;color:var(--muted)">花园启程 · 小星星入册 · 三月出生纪念</p></div>
        <div class="card span4"><span class="label">月龄</span><b>3</b></div>
      </div>
    </section>

    <section class="view" id="timeline">
      <h2 style="font-family:var(--serif);margin-bottom:20px">藤蔓时间轴</h2>
      <div class="vine">
        <div class="vine-item"><strong>2026-06-04</strong> · 花园启程 <span style="color:var(--muted)">— 数字树种下</span></div>
        <div class="vine-item"><strong>2026-03-15</strong> · 小星星 <span style="color:var(--muted)">— 睡前儿歌</span></div>
        <div class="vine-item"><strong>2026-03-05</strong> · Ivy 出生 <span style="color:var(--muted)">— 上海</span></div>
      </div>
    </section>

    <section class="view" id="playlist">
      <h2 style="font-family:var(--serif);margin-bottom:20px">成长歌单</h2>
      <div class="song-card"><div class="disc">♪</div><div><strong>小星星</strong><div style="font-size:13px;color:var(--muted);margin-top:4px">传统儿歌 · 0月龄 · 睡前</div></div></div>
      <div class="song-card"><div class="disc">♪</div><div><strong>世上只有妈妈好</strong><div style="font-size:13px;color:var(--muted);margin-top:4px">经典儿歌 · 2月龄</div></div></div>
    </section>

    <section class="view" id="media">
      <h2 style="font-family:var(--serif);margin-bottom:20px">媒体瀑布</h2>
      <div class="media-masonry">
        <div class="tile"><div class="tile-cover"></div><div class="tile-body">第一次笑</div></div>
        <div class="tile"><div class="tile-cover" style="height:180px"></div><div class="tile-body">洗澡视频</div></div>
        <div class="tile"><div class="tile-cover" style="height:100px"></div><div class="tile-body">爸爸哼唱</div></div>
        <div class="tile"><div class="tile-cover"></div><div class="tile-body">花园启程</div></div>
      </div>
    </section>
  </div>
  <a class="back" href="index.html">← 选择</a>
  <script>
    document.querySelectorAll('[data-view]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.view).classList.add('active');
      });
    });
  </script>
</body>
</html>
